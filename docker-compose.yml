version: '3.8'

services:
  db:
    image: postgres:15
    container_name: arena_db
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_password
      POSTGRES_DB: arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
